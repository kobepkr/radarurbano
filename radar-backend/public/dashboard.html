<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Urbano - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .header { background: #1a1a2e; padding: 20px 30px; border-bottom: 2px solid #DC2626; }
    .header h1 { color: #DC2626; font-size: 24px; }
    .header p { color: #888; font-size: 14px; margin-top: 4px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 30px; }
    .stat-card { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a3e; }
    .stat-card .label { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: bold; }
    .stat-card.total .value { color: #DC2626; }
    .stat-card.confirmed .value { color: #4CAF50; }
    .stat-card.false .value { color: #F44336; }
    .stat-card.pending .value { color: #FFA500; }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; padding: 0 30px 30px; }
    .chart-card { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a3e; }
    .chart-card h3 { font-size: 16px; margin-bottom: 16px; color: #ccc; }
    .chart-card canvas { max-height: 300px; }
    .refresh { background: #DC2626; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .refresh:hover { background: #b91c1c; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .loading { text-align: center; color: #888; padding: 40px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="top-bar">
      <div>
        <h1>Radar Urbano</h1>
        <p>Dashboard de estadísticas en tiempo real</p>
      </div>
      <button class="refresh" onclick="cargarTodo()">Actualizar</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card total"><div class="label">Total Alertas</div><div class="value" id="total">-</div></div>
    <div class="stat-card confirmed"><div class="label">Confirmadas</div><div class="value" id="confirmados">-</div></div>
    <div class="stat-card false"><div class="label">Falsas</div><div class="value" id="falsos">-</div></div>
    <div class="stat-card pending"><div class="label">Pendientes</div><div class="value" id="pendientes">-</div></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>Reportes por día (últimos 30 días)</h3>
      <canvas id="chartDias"></canvas>
    </div>
    <div class="chart-card">
      <h3>Por categoría</h3>
      <canvas id="chartCategorias"></canvas>
    </div>
    <div class="chart-card">
      <h3>Por horario</h3>
      <canvas id="chartHorario"></canvas>
    </div>
    <div class="chart-card">
      <h3>Top usuarios</h3>
      <canvas id="chartUsuarios"></canvas>
    </div>
  </div>

  <script>
    const API = '/api/estadisticas';
    let charts = {};

    async function fetchJSON(path) {
      const res = await fetch(path);
      return res.json();
    }

    async function cargarResumen() {
      const d = await fetchJSON(`${API}/resumen`);
      document.getElementById('total').textContent = d.total || 0;
      document.getElementById('confirmados').textContent = d.confirmados || 0;
      document.getElementById('falsos').textContent = d.falsos || 0;
      document.getElementById('pendientes').textContent = d.pendientes || 0;
    }

    async function cargarDias() {
      const hace30 = new Date();
      hace30.setDate(hace30.getDate() - 30);
      const d = await fetchJSON(`${API}/reportes-por-dia?desde=${hace30.toISOString().split('T')[0]}`);
      graficar('chartDias', 'line', d.map(r => r._id), d.map(r => r.total), '#DC2626');
    }

    async function cargarCategorias() {
      const d = await fetchJSON(`${API}/por-categoria`);
      const labels = { transito: 'Tránsito', seguridad: 'Seguridad', emergencias: 'Emergencias', comunidad: 'Comunidad', mascotas: 'Mascotas', ambiente: 'Ambiente', servicios: 'Servicios' };
      graficar('chartCategorias', 'bar', d.map(r => labels[r._id] || r._id), d.map(r => r.total), ['#DC2626', '#FF9800', '#F44336', '#4CAF50', '#9C27B0', '#2196F3', '#FFC107']);
    }

    async function cargarHorario() {
      const d = await fetchJSON(`${API}/por-horario`);
      const labels = d.map(r => `${r._id}:00`);
      graficar('chartHorario', 'bar', labels, d.map(r => r.total), '#2196F3');
    }

    async function cargarUsuarios() {
      const d = await fetchJSON(`${API}/top-usuarios`);
      graficar('chartUsuarios', 'bar', d.map(r => r._id || 'Anónimo'), d.map(r => r.total), '#FF9800');
    }

    function graficar(id, tipo, labels, data, color) {
      if (charts[id]) charts[id].destroy();
      const ctx = document.getElementById(id).getContext('2d');
      charts[id] = new Chart(ctx, {
        type: tipo,
        data: {
          labels,
          datasets: [{
            label: 'Reportes',
            data,
            backgroundColor: Array.isArray(color) ? color : `${color}44`,
            borderColor: color,
            borderWidth: 2,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#888', maxTicksLimit: 20 } },
            y: { ticks: { color: '#888' }, beginAtZero: true }
          }
        }
      });
    }

    async function cargarTodo() {
      await Promise.all([cargarResumen(), cargarDias(), cargarCategorias(), cargarHorario(), cargarUsuarios()]);
    }

    cargarTodo();
  </script>
</body>
</html>
